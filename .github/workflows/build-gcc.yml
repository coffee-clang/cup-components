name: Build GCC

on:
  workflow_dispatch:
    inputs:
      version:
        description: GCC version, or stable
        required: true
        default: stable
      source_sha256:
        description: Optional SHA-256 to verify the selected source archive
        required: false
        default: ''
      binutils_version:
        description: Bundled Binutils version, or stable
        required: true
        default: stable
      binutils_source_sha256:
        description: Optional SHA-256 to verify the selected Binutils source archive
        required: false
        default: ''
      mingw_version:
        description: MinGW-w64 version for Windows targets, or stable
        required: true
        default: stable
      mingw_source_sha256:
        description: Optional SHA-256 to verify the selected MinGW-w64 source archive
        required: false
        default: ''
      revision:
        description: GCC package revision, or stable for the default stable composition
        required: true
        default: stable
      host_platform:
        description: Host platform
        required: true
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - windows-x64
        default: linux-x64
      target_platform:
        description: Target platform
        required: true
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - windows-x64
        default: linux-x64
      publish:
        description: Publish packages as GitHub Release assets
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.platform.outputs.runner }}
      host_platform: ${{ steps.platform.outputs.host_platform }}
      target_platform: ${{ steps.platform.outputs.target_platform }}
    steps:
      - id: platform
        shell: bash
        run: |
          host_platform="${{ inputs.host_platform }}"
          target_platform="${{ inputs.target_platform }}"
          case "$host_platform" in
            linux-x64) runner="ubuntu-24.04" ;;
            linux-arm64) runner="ubuntu-24.04-arm" ;;
            windows-x64) runner="windows-2025" ;;
            *)
              echo "Unsupported GCC host platform: $host_platform" >&2
              exit 1
              ;;
          esac

          case "$host_platform:$target_platform" in
            linux-x64:linux-x64|linux-x64:windows-x64|linux-arm64:linux-arm64|windows-x64:windows-x64) ;;
            *)
              echo "Unsupported GCC build combination: $host_platform -> $target_platform" >&2
              exit 1
              ;;
          esac

          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "host_platform=$host_platform" >> "$GITHUB_OUTPUT"
          echo "target_platform=$target_platform" >> "$GITHUB_OUTPUT"

      - name: Checkout for package-contract verification
        uses: actions/checkout@v5

      - name: Verify common package contract
        shell: bash
        run: bash scripts/test/test-package-contract.sh

  build:
    needs: select
    runs-on: ${{ needs.select.outputs.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize build records
        shell: bash
        env:
          CUP_SOURCE_SHA256: ${{ inputs.source_sha256 }}
          CUP_GCC_BINUTILS_VERSION: ${{ inputs.binutils_version }}
          CUP_BINUTILS_SOURCE_SHA256: ${{ inputs.binutils_source_sha256 }}
          CUP_GCC_MINGW_VERSION: ${{ inputs.mingw_version }}
          CUP_MINGW_SOURCE_SHA256: ${{ inputs.mingw_source_sha256 }}
          CUP_GCC_REVISION: ${{ inputs.revision }}
        run: |
          bash scripts/workflow/build-records.sh init \
            gcc \
            "${{ inputs.version }}" \
            "${{ needs.select.outputs.host_platform }}" \
            "${{ needs.select.outputs.target_platform }}"

      - name: Build Docker image
        if: ${{ startsWith(needs.select.outputs.host_platform, 'linux-') }}
        run: bash scripts/workflow/build-records.sh run builder-setup docker build -f docker/toolchain-builder.Dockerfile -t cup-toolchain-builder .

      - name: Build package (Linux)
        if: ${{ startsWith(needs.select.outputs.host_platform, 'linux-') }}
        run: |
          docker run --rm \
            -e CUP_BUILD_ENVIRONMENT=docker-toolchain \
            -e CUP_SOURCE_SHA256="${{ inputs.source_sha256 }}" \
            -e CUP_GCC_BINUTILS_VERSION="${{ inputs.binutils_version }}" \
            -e CUP_BINUTILS_SOURCE_SHA256="${{ inputs.binutils_source_sha256 }}" \
            -e CUP_GCC_MINGW_VERSION="${{ inputs.mingw_version }}" \
            -e CUP_MINGW_SOURCE_SHA256="${{ inputs.mingw_source_sha256 }}" \
            -e CUP_GCC_REVISION="${{ inputs.revision }}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            cup-toolchain-builder \
            bash scripts/workflow/build-records.sh run build \
              bash scripts/build/build-gcc.sh \
                "${{ inputs.version }}" \
                "${{ needs.select.outputs.host_platform }}" \
                "${{ needs.select.outputs.target_platform }}"

      - name: Test packaged GCC (Linux)
        if: ${{ startsWith(needs.select.outputs.host_platform, 'linux-') }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            cup-toolchain-builder \
            bash scripts/workflow/build-records.sh run product-test \
              bash scripts/test/test-gcc.sh \
                "${{ needs.select.outputs.host_platform }}" \
                "${{ needs.select.outputs.target_platform }}"

      - name: Set up MSYS2 UCRT64
        if: ${{ startsWith(needs.select.outputs.host_platform, 'windows-') }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - name: Install build dependencies (Windows UCRT64)
        if: ${{ startsWith(needs.select.outputs.host_platform, 'windows-') }}
        shell: msys2 {0}
        run: bash scripts/workflow/build-records.sh run dependencies bash scripts/setup/setup-windows-msys2.sh ucrt64

      - name: Build package (Windows)
        if: ${{ startsWith(needs.select.outputs.host_platform, 'windows-') }}
        shell: msys2 {0}
        run: |
          export CUP_BUILD_ENVIRONMENT=msys2-ucrt64
          export CUP_SOURCE_SHA256="${{ inputs.source_sha256 }}"
          export CUP_GCC_BINUTILS_VERSION="${{ inputs.binutils_version }}"
          export CUP_BINUTILS_SOURCE_SHA256="${{ inputs.binutils_source_sha256 }}"
          export CUP_GCC_MINGW_VERSION="${{ inputs.mingw_version }}"
          export CUP_MINGW_SOURCE_SHA256="${{ inputs.mingw_source_sha256 }}"
          export CUP_GCC_REVISION="${{ inputs.revision }}"
          bash scripts/workflow/build-records.sh run build \
            bash scripts/build/build-gcc.sh \
              "${{ inputs.version }}" \
              "${{ needs.select.outputs.host_platform }}" \
              "${{ needs.select.outputs.target_platform }}"

      - name: Test packaged GCC (Windows)
        if: ${{ startsWith(needs.select.outputs.host_platform, 'windows-') }}
        shell: pwsh
        run: scripts/workflow/build-records-windows.ps1 -Phase product-test -Script scripts/test/test-gcc-windows.ps1

      - name: Load release metadata
        id: release
        shell: bash
        run: |
          source dist/release.env
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Verify package checksums before upload
        shell: bash
        run: |
          bash scripts/workflow/build-records.sh run checksum-verification \
            bash -c 'source dist/release.env; source scripts/package/package-common.sh; verify_package_checksums "$package_base" "$GITHUB_WORKSPACE/dist"'

      - name: Upload workflow artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.release.outputs.tag }}
          path: |
            dist/*.tar.xz
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/release.env
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          repo="${GITHUB_REPOSITORY}"

          release_lookup="$(mktemp)"
          release_status=0
          gh api --include "repos/$repo/releases/tags/$tag" >"$release_lookup" 2>&1 || release_status=$?

          if [ "$release_status" -eq 0 ]; then
            rm -f "$release_lookup"
            gh release delete "$tag" --repo "$repo" --cleanup-tag --yes
          else
            http_status="$(sed -n 's#^HTTP/[^ ]* \([0-9][0-9][0-9]\).*#\1#p' "$release_lookup")"
            if [ "$http_status" != 404 ]; then
              cat "$release_lookup" >&2
              rm -f "$release_lookup"
              exit "$release_status"
            fi
            rm -f "$release_lookup"

            tag_status=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 || tag_status=$?
            case "$tag_status" in
              0) git push origin ":refs/tags/$tag" ;;
              2) ;;
              *) echo "failed to determine remote tag state for '$tag'" >&2; exit "$tag_status" ;;
            esac
          fi

          gh release create "$tag" dist/*.tar.xz dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --repo "$repo" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Automated cup component build for $tag"
      - name: Finalize build records
        if: ${{ always() }}
        shell: bash
        env:
          CUP_WORKFLOW_STATUS: ${{ job.status }}
        run: bash scripts/workflow/build-records.sh finalize

      - name: Upload build records
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: build-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cup-build/build-records
          if-no-files-found: error
