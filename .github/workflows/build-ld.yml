name: Build GNU ld

on:
  workflow_dispatch:
    inputs:
      version:
        description: GNU Binutils/ld version, or default
        required: true
        default: default
      source_sha256:
        description: Optional SHA-256 to verify the selected source archive
        required: false
        default: ''
      revision:
        description: Optional package revision number
        required: false
        default: ''
      revision_reason:
        description: Required short reason when revision is set
        required: false
        default: ''
      host_platform:
        description: Host platform
        required: true
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - windows-x64
        default: linux-x64
      target_platform:
        description: Target platform
        required: true
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - windows-x64
        default: linux-x64
      publish:
        description: Publish packages as GitHub Release assets
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.platform.outputs.runner }}
      host_platform: ${{ steps.platform.outputs.host_platform }}
      target_platform: ${{ steps.platform.outputs.target_platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - id: platform
        shell: bash
        run: |
          host_platform="${{ inputs.host_platform }}"
          target_platform="${{ inputs.target_platform }}"

          case "$host_platform" in
            linux-x64) runner="ubuntu-24.04" ;;
            linux-arm64) runner="ubuntu-24.04-arm" ;;
            windows-x64) runner="windows-2025" ;;
            *)
              echo "Unsupported GNU ld host platform: $host_platform" >&2
              exit 1
              ;;
          esac

          source scripts/package/package-common.sh
          package_scope_is_supported ld "$host_platform" "$target_platform" || {
            echo "Unsupported GNU ld build combination: $host_platform -> $target_platform" >&2
            exit 1
          }

          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "host_platform=$host_platform" >> "$GITHUB_OUTPUT"
          echo "target_platform=$target_platform" >> "$GITHUB_OUTPUT"

      - name: Verify common package contract
        shell: bash
        run: bash scripts/test/test-package-contract.sh

  build:
    needs: select
    concurrency:
      group: ${{ inputs.publish && format('package-ld-{0}-{1}-{2}-{3}', inputs.version, inputs.revision, needs.select.outputs.host_platform, needs.select.outputs.target_platform) || format('package-ld-run-{0}', github.run_id) }}
      queue: max
    runs-on: ${{ needs.select.outputs.runner }}
    env:
      CUP_PACKAGE_REVISION: ${{ inputs.revision }}
      CUP_PACKAGE_REVISION_REASON: ${{ inputs.revision_reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize build records
        shell: bash
        env:
          CUP_SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          bash scripts/workflow/build-records.sh init \
            ld \
            "${{ inputs.version }}" \
            "${{ needs.select.outputs.host_platform }}" \
            "${{ needs.select.outputs.target_platform }}"

      - name: Build Docker image
        if: ${{ startsWith(needs.select.outputs.host_platform, 'linux-') }}
        run: bash scripts/workflow/build-records.sh run builder-setup docker build -f docker/toolchain-builder.Dockerfile -t cup-toolchain-builder .

      - name: Build package (Linux)
        if: ${{ startsWith(needs.select.outputs.host_platform, 'linux-') }}
        run: |
          docker run --rm \
            -e CUP_BUILD_ENVIRONMENT=docker-toolchain \
            -e CUP_SOURCE_SHA256="${{ inputs.source_sha256 }}" \
            -e CUP_PACKAGE_REVISION \
            -e CUP_PACKAGE_REVISION_REASON \
            -v "$PWD:/workspace" \
            -w /workspace \
            cup-toolchain-builder \
            bash scripts/workflow/build-records.sh run build \
              bash scripts/build/build-ld.sh \
                "${{ inputs.version }}" \
                "${{ needs.select.outputs.host_platform }}" \
                "${{ needs.select.outputs.target_platform }}"

      - name: Test packaged GNU ld (Linux)
        if: ${{ startsWith(needs.select.outputs.host_platform, 'linux-') }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            cup-toolchain-builder \
            bash scripts/workflow/build-records.sh run product-test \
              bash scripts/test/test-ld.sh \
                "${{ needs.select.outputs.host_platform }}" \
                "${{ needs.select.outputs.target_platform }}"

      - name: Set up MSYS2 UCRT64
        if: ${{ startsWith(needs.select.outputs.host_platform, 'windows-') }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true

      - name: Install build dependencies (Windows UCRT64)
        if: ${{ startsWith(needs.select.outputs.host_platform, 'windows-') }}
        shell: msys2 {0}
        run: bash scripts/workflow/build-records.sh run dependencies bash scripts/setup/setup-windows-msys2.sh ucrt64

      - name: Build package (Windows)
        if: ${{ startsWith(needs.select.outputs.host_platform, 'windows-') }}
        shell: msys2 {0}
        run: |
          export CUP_BUILD_ENVIRONMENT=msys2-ucrt64
          export CUP_SOURCE_SHA256="${{ inputs.source_sha256 }}"
          bash scripts/workflow/build-records.sh run build \
            bash scripts/build/build-ld.sh \
              "${{ inputs.version }}" \
              "${{ needs.select.outputs.host_platform }}" \
              "${{ needs.select.outputs.target_platform }}"

      - name: Test packaged GNU ld (Windows)
        if: ${{ startsWith(needs.select.outputs.host_platform, 'windows-') }}
        shell: pwsh
        run: scripts/workflow/build-records-windows.ps1 -Phase product-test -Script scripts/test/test-ld-windows.ps1

      - name: Load release metadata
        id: release
        shell: bash
        run: |
          source dist/release.env
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.release.outputs.tag }}
          path: |
            dist/*.tar.xz
            dist/*.tar.gz
            dist/*.zip
            dist/publication.txt
            dist/release.env
          if-no-files-found: error
          compression-level: 1

      - name: Publish immutable package
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          expected_ref="refs/heads/${{ github.event.repository.default_branch }}"
          [ "$GITHUB_REF" = "$expected_ref" ] || {
            echo "Package publication is allowed only from $expected_ref" >&2
            exit 1
          }
          bash scripts/publish/publish-package.sh \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_WORKSPACE/dist"

      - name: Queue catalog update
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run update-catalog.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f package_tag="${{ steps.release.outputs.tag }}"

      - name: Finalize build records
        if: ${{ always() }}
        shell: bash
        env:
          CUP_WORKFLOW_STATUS: ${{ job.status }}
        run: bash scripts/workflow/build-records.sh finalize

      - name: Upload build records
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: build-records-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cup-build/build-records
          if-no-files-found: error
