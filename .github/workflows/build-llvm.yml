name: Build LLVM tool

on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Run all supported LLVM tools on all supported native platforms
        required: true
        type: boolean
        default: false
      tool:
        description: Used only when full matrix is disabled
        required: true
        type: choice
        options:
          - select
          - clang
          - lld
          - lldb
          - clangd
          - clang-format
          - clang-tidy
        default: select
      version:
        description: Tool version, or default
        required: true
        default: default
      source_sha256:
        description: Optional SHA-256 to verify the selected source archive
        required: false
        default: ''
      revision:
        description: Optional package revision number
        required: false
        default: ''
      revision_reason:
        description: Required short reason when revision is set
        required: false
        default: ''
      platform:
        description: Used only when full matrix is disabled
        required: true
        type: choice
        options:
          - select
          - linux-x64
          - linux-arm64
          - windows-x64
          - macos-x64
          - macos-arm64
        default: select
      publish:
        description: Publish packages as GitHub Release assets
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  select:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platform.outputs.matrix }}
      package_version: ${{ steps.platform.outputs.package_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - id: platform
        shell: bash
        run: |
          full_matrix="${{ inputs.full_matrix }}"
          selected_tool="${{ inputs.tool }}"
          selected_platform="${{ inputs.platform }}"

          source scripts/package/package-common.sh
          package_revision_inputs_validate "${{ inputs.revision }}" "${{ inputs.revision_reason }}"
          package_version="$(package_version_name "$(resolve_version llvm "${{ inputs.version }}")" "${{ inputs.revision }}")"

          runner_for_platform() {
            case "$1" in
              linux-x64) runner="ubuntu-24.04" ;;
              linux-arm64) runner="ubuntu-24.04-arm" ;;
              windows-x64) runner="windows-2025" ;;
              macos-x64) runner="macos-15-intel" ;;
              macos-arm64) runner="macos-15" ;;
              *)
                echo "Unsupported LLVM platform: $1" >&2
                exit 1
                ;;
            esac
          }

          matrix='{"include":['
          separator=''
          add_entry() {
            tool="$1"
            platform="$2"
            runner_for_platform "$platform"
            matrix="${matrix}${separator}{\"tool\":\"$tool\",\"platform\":\"$platform\",\"runner\":\"$runner\",\"host_platform\":\"$platform\",\"target_platform\":\"$platform\"}"
            separator=','
          }

          if [ "$full_matrix" = true ]; then
            for tool in clang lld lldb clangd clang-format clang-tidy; do
              for platform in linux-x64 linux-arm64 windows-x64 macos-x64 macos-arm64; do
                add_entry "$tool" "$platform"
              done
            done
          else
            if [ "$selected_tool" = select ] || [ "$selected_platform" = select ]; then
              echo "tool and platform must be selected when full_matrix is disabled" >&2
              exit 1
            fi
            add_entry "$selected_tool" "$selected_platform"
          fi

          matrix="${matrix}]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Verify common package contract
        shell: bash
        run: bash scripts/test/test-package-contract.sh

  build:
    needs: select
    name: ${{ matrix.tool }} ${{ inputs.version }} ${{ matrix.platform }}
    concurrency:
      group: ${{ inputs.publish && format('package-{0}-{1}-{2}', matrix.tool, needs.select.outputs.package_version, matrix.platform) || format('package-llvm-run-{0}-{1}-{2}', github.run_id, matrix.tool, matrix.platform) }}
      queue: max
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CUP_PACKAGE_REVISION: ${{ inputs.revision }}
      CUP_PACKAGE_REVISION_REASON: ${{ inputs.revision_reason }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize build records
        shell: bash
        env:
          CUP_SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          bash scripts/workflow/build-records.sh init \
            "${{ matrix.tool }}" \
            "${{ inputs.version }}" \
            "${{ matrix.host_platform }}" \
            "${{ matrix.target_platform }}"

      - name: Build Docker image
        if: ${{ startsWith(matrix.host_platform, 'linux-') }}
        run: bash scripts/workflow/build-records.sh run builder-setup docker build -f docker/llvm-builder.Dockerfile -t cup-llvm-builder .

      - name: Build package (Linux)
        if: ${{ startsWith(matrix.host_platform, 'linux-') }}
        run: |
          docker run --rm \
            -e CUP_BUILD_ENVIRONMENT=docker-llvm \
            -e CUP_SOURCE_SHA256="${{ inputs.source_sha256 }}" \
            -e CUP_PACKAGE_REVISION \
            -e CUP_PACKAGE_REVISION_REASON \
            -v "$PWD:/workspace" \
            -w /workspace \
            cup-llvm-builder \
            bash scripts/workflow/build-records.sh run build \
              bash scripts/build/build-llvm-tool.sh \
                "${{ matrix.tool }}" \
                "${{ inputs.version }}" \
                "${{ matrix.host_platform }}"

      - name: Test packaged LLVM tool (Linux)
        if: ${{ startsWith(matrix.host_platform, 'linux-') }}
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            cup-llvm-builder \
            bash scripts/workflow/build-records.sh run product-test \
              bash scripts/test/test-llvm-tool.sh "${{ matrix.tool }}"

      - name: Set up MSYS2 CLANG64
        if: ${{ startsWith(matrix.host_platform, 'windows-') }}
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true

      - name: Install build dependencies (Windows CLANG64)
        if: ${{ startsWith(matrix.host_platform, 'windows-') }}
        shell: msys2 {0}
        run: bash scripts/workflow/build-records.sh run dependencies bash scripts/setup/setup-windows-msys2.sh clang64

      - name: Build package (Windows)
        if: ${{ startsWith(matrix.host_platform, 'windows-') }}
        shell: msys2 {0}
        run: |
          export CUP_BUILD_ENVIRONMENT=msys2-clang64
          export CUP_SOURCE_SHA256="${{ inputs.source_sha256 }}"
          bash scripts/workflow/build-records.sh run build \
            bash scripts/build/build-llvm-tool.sh \
              "${{ matrix.tool }}" \
              "${{ inputs.version }}" \
              "${{ matrix.host_platform }}"

      - name: Test packaged LLVM tool (Windows)
        if: ${{ startsWith(matrix.host_platform, 'windows-') }}
        shell: pwsh
        run: |
          $env:Path = "${{ steps.msys2.outputs.msys2-location }}\clang64\bin;$env:Path"
          scripts/workflow/build-records-windows.ps1 -Phase product-test -Script scripts/test/test-llvm-tool-windows.ps1 -Arguments @('-Tool', '${{ matrix.tool }}')

      - name: Install build dependencies (macOS)
        if: ${{ startsWith(matrix.host_platform, 'macos-') }}
        shell: bash
        run: bash scripts/workflow/build-records.sh run dependencies bash scripts/setup/setup-macos-builder.sh

      - name: Build package (macOS)
        if: ${{ startsWith(matrix.host_platform, 'macos-') }}
        shell: bash
        run: |
          brew_bash="$(brew --prefix bash)/bin/bash"
          export CUP_BUILD_ENVIRONMENT=github-macos
          export CUP_SOURCE_SHA256="${{ inputs.source_sha256 }}"
          "$brew_bash" scripts/workflow/build-records.sh run build \
            "$brew_bash" scripts/build/build-llvm-tool.sh \
              "${{ matrix.tool }}" \
              "${{ inputs.version }}" \
              "${{ matrix.host_platform }}"

      - name: Test packaged LLVM tool (macOS)
        if: ${{ startsWith(matrix.host_platform, 'macos-') }}
        shell: bash
        run: |
          brew_bash="$(brew --prefix bash)/bin/bash"
          "$brew_bash" scripts/workflow/build-records.sh run product-test \
            "$brew_bash" scripts/test/test-llvm-tool.sh "${{ matrix.tool }}"

      - name: Load release metadata
        id: release
        shell: bash
        run: |
          source dist/release.env
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.release.outputs.tag }}
          path: |
            dist/*.tar.xz
            dist/*.tar.gz
            dist/*.zip
            dist/publication.txt
            dist/release.env
          if-no-files-found: error
          compression-level: 1

      - name: Publish immutable package
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          expected_ref="refs/heads/${{ github.event.repository.default_branch }}"
          [ "$GITHUB_REF" = "$expected_ref" ] || {
            echo "Package publication is allowed only from $expected_ref" >&2
            exit 1
          }
          bash scripts/publish/publish-package.sh \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_WORKSPACE/dist"

      - name: Queue catalog update
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run update-catalog.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f package_tag="${{ steps.release.outputs.tag }}"

      - name: Finalize build records
        if: ${{ always() }}
        shell: bash
        env:
          CUP_WORKFLOW_STATUS: ${{ job.status }}
        run: bash scripts/workflow/build-records.sh finalize

      - name: Upload build records
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: build-records-${{ matrix.tool }}-${{ inputs.version }}-${{ matrix.host_platform }}-${{ matrix.target_platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cup-build/build-records
          if-no-files-found: error
