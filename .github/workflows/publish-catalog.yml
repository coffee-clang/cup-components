name: Publish Catalog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Bootstrap the empty revision-0 endpoint once, or resync it for recovery
        required: true
        type: choice
        options:
          - sync
          - bootstrap
        default: sync

permissions:
  contents: write

concurrency:
  group: cup-components-catalog
  queue: max

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current catalog authority
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Publish catalog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash scripts/publish/publish-catalog.sh \
            "${{ inputs.mode }}" \
            "$GITHUB_REPOSITORY" \
            "$GITHUB_WORKSPACE/catalog/catalog.cfg"
