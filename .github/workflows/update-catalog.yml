name: Update Catalog

on:
  workflow_dispatch:
    inputs:
      package_tag:
        description: Published immutable package tag to activate
        required: true

permissions:
  contents: write

concurrency:
  group: cup-components-catalog
  queue: max

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current catalog authority
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Configure repository writer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Activate package and publish catalog
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          bash scripts/catalog/update-catalog.sh \
            "$GITHUB_REPOSITORY" \
            "${{ github.event.repository.default_branch }}" \
            "${{ inputs.package_tag }}"
